# =============================================
# Microservicio accounts
# =============================================
spring.application.name=accounts
server.port=${PORT:8081}

# Archivo local con secretos (no se versiona). Ver application-secrets.properties.example
spring.config.import=optional:file:./.environments/application-secrets.properties

# =============================================
# TiDB (MySQL compatible) - paso 6
# Misma base de datos que users (crud_usuarios), tabla accounts.
# =============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crud_usuarios}?sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Crea la tabla accounts al arrancar si no existe
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# =============================================
# RabbitMQ en CloudAMQP - paso 7
# RABBITMQ_URL: amqps://usuario:clave@host/vhost (panel de CloudAMQP > AMQP URL)
# =============================================
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=1s
messaging.exchange=${MESSAGING_EXCHANGE:domain.events}
